<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10101c">
  <title>WeWe AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-mark">W</div>
      <div>
        <h1>WeWe AI</h1>
        <p>مساعدك الذكي — نسخة تجريبية</p>
      </div>
      <span class="status" title="واجهة تجريبية"></span>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <article class="bubble assistant">
        <span class="bubble-label">WeWe AI</span>
        <p>أهلًا فيك! 👋 أنا واجهة WeWe AI التجريبية. لسه عم نجهّز نموذج الذكاء الاصطناعي الخاص فينا.</p>
      </article>
    </section>

    <form id="chat-form" class="composer">
      <textarea id="message-input" rows="1" maxlength="2000" placeholder="اكتب رسالتك هون..." aria-label="رسالتك"></textarea>
      <button id="send-button" type="submit" aria-label="إرسال">➤</button>
    </form>
    <footer>WeWe AI · إصدار تجريبي مبكر</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
